<style>
/* تخطيط: تطبيق جوال بعمود واحد، شريط تنقل سفلي، وزر بصمة كبير في الرئيسية */
:root{
  --bg:#f2f5f6; --surface:#ffffff; --surface-2:#f7f9fa; --ink:#10202b; --muted:#5d6d78; --line:#dde4e8;
  --brand:#0e5c63; --brand-ink:#ffffff; --brand-soft:#e2efef;
  --ok:#1d7f48; --ok-soft:#e3f3e9; --warn:#a8650c; --warn-soft:#fbf0dd; --bad:#b4322a; --bad-soft:#f9e4e2;
  --font:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1418; --surface:#142027; --surface-2:#1a2830; --ink:#e5edf1; --muted:#93a5b0; --line:#253640;
  --brand:#43b5ab; --brand-ink:#05201f; --brand-soft:#123533;
  --ok:#4cc483; --ok-soft:#123222; --warn:#e3a54a; --warn-soft:#3a2a10; --bad:#ec7a70; --bad-soft:#3b1a17; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 4px}
header.top h1{font:700 18px/1.3 var(--display);margin:0;text-wrap:balance}
header.top .sub{color:var(--muted);font-size:13px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:13px;cursor:pointer}
h2{font:700 17px/1.4 var(--display);margin:18px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.num{font-variant-numeric:tabular-nums;font-family:var(--display)}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--brand);color:var(--brand-ink);font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input[type=checkbox]{width:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--brand-soft);color:var(--brand)}
.p-mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main{min-width:0;flex:1}
.item .t{font-weight:600}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.alert{border-radius:12px;padding:12px 14px;font-size:14px}
.alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.info{background:var(--brand-soft);color:var(--brand)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}

/* بطاقة البصمة */
.punch{text-align:center;padding:22px 16px}
.clock{font:700 44px/1.1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:1px}
.date{color:var(--muted);margin-top:4px}
.punch-btn{margin:20px auto 8px;width:168px;height:168px;border-radius:50%;border:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:700 17px var(--display);
  background:var(--brand);color:var(--brand-ink);box-shadow:0 0 0 10px var(--brand-soft)}
.punch-btn.out{background:var(--warn);color:#fff;box-shadow:0 0 0 10px var(--warn-soft)}
.punch-btn.done{background:var(--surface-2);color:var(--muted);box-shadow:0 0 0 10px var(--line);cursor:default}
.punch-btn svg{width:40px;height:40px}
.times{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.times div{background:var(--surface-2);border-radius:10px;padding:8px 4px}
.times b{display:block;font:600 16px var(--display);font-variant-numeric:tabular-nums}
.times span{font-size:12px;color:var(--muted)}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font:700 24px/1.2 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:4px 0 8px;scrollbar-width:none}

.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}

.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}

td input{padding:6px 8px;width:90px}

nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);

nav.bottom button svg{width:24px;height:24px}
nav.bottom button.on{color:var(--brand);font-weight:600}
nav.bottom button{position:relative}
.badge{position:absolute;top:2px;left:50%;margin-left:6px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;font-weight:700;min-width:17px;height:17px;line-height:17px;padding:0 4px;text-align:center}

.sheet-bg{position:fixed;inset:0;background:rgba(5,15,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;

.toast.bad{background:var(--bad);color:#fff}

.auth{max-width:420px;margin:8vh auto 0}
#inst{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px}
.inst{display:flex;align-items:center;gap:12px;background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:10px 12px}

.inst .tx{flex:1;min-width:0;font-size:13px;line-height:1.4}.inst .tx b{display:block;font-size:14px}
.inst .go{background:var(--brand-ink);color:var(--brand);border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;white-space:nowrap}
.inst .x{background:none;border:0;color:inherit;font-size:20px;line-height:1;cursor:pointer;padding:4px;opacity:.8}
.ios-step{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ios-step:last-child{border-bottom:0}
.ios-step .n{width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}

@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* ---------- أدوات ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);

const hm=m=>{m=Math.max(0,m|0);return `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`};
const monthNow=()=>todayStr().slice(0,7);
const monthRange=ym=>{const [y,m]=ym.split('-').map(Number);const last=new Date(Date.UTC(y,m,0)).getUTCDate();return [`${ym}-01`,`${ym}-${String(last).padStart(2,'0')}`]};
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};

function sheet(html,onMount){const bg=document.createElement('div');bg.className='sheet-bg';bg.innerHTML=`<div class="sheet">${html}</div>`;
  bg.addEventListener('click',e=>{if(e.target===bg)bg.remove()});document.body.appendChild(bg);onMount&&onMount(bg.querySelector('.sheet'),()=>bg.remove());return bg}
function form(el){const o={};el.querySelectorAll('[name]').forEach(i=>{o[i.name]=i.type==='checkbox'?i.checked:(i.value===''?null:i.value)});return o}
function downloadCSV(name,rows){const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function getPos(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej({code:0});
  navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:20000,maximumAge:0})})}
function geoErr(e){return e.code===1?'لازم تسمح للتطبيق بالوصول لموقعك من إعدادات المتصفح ثم تحاول مرة ثانية':e.code===3?'تأخر تحديد الموقع، تأكد إن الـ GPS شغال وحاول مرة ثانية':'تعذر تحديد موقعك، شغّل خدمات الموقع وحاول مرة ثانية'}
const opts=(arr,sel,empty='— اختر —')=>`<option value="">${empty}</option>`+arr.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name||x.full_name)}</option>`).join('');

const I={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
 pay:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
 team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.3"/><path d="M16 15c3 0 5 1.6 5 4"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg>',
 pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
 finger:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 11a5 5 0 0 1 10 0v2"/><path d="M12 11v6a3 3 0 0 0 1 2"/><path d="M9.5 11.5V15c0 2 .6 3.6 1.6 5"/><path d="M14.5 13v1.5c0 1.6.5 3 1.3 4"/><path d="M4.5 9a8 8 0 0 1 15 0"/></svg>'
};

/* ---------- البيانات المرجعية ---------- */

/* ---------- تسجيل الدخول ---------- */
function vAuth(mode='in'){
  nav.hidden=true;
  app.innerHTML=`<div class="auth">
    <div class="logo">${I.finger}</div>
    <h1>${mode==='in'?'تسجيل الدخول':'حساب موظف جديد'}</h1>
    <p class="muted">${mode==='in'?'ادخل برقم الهوية أو الإقامة وكلمة المرور':'سجّل بياناتك، وبعدها تفعّل الموارد البشرية حسابك'}</p>
    <form id="af" class="stack card">
      ${mode==='up'?'<label class="f">الاسم الكامل<input name="full_name" required autocomplete="name"></label>':''}
      <label class="f">رقم الهوية أو الإقامة<input name="nid" required inputmode="numeric" autocomplete="username" placeholder="10 أرقام" dir="ltr"></label>
      ${mode==='up'?'<label class="f">رقم الجوال<input name="phone" type="tel" required inputmode="tel" autocomplete="tel" placeholder="05XXXXXXXX" dir="ltr"></label>':''}
      <label class="f">كلمة المرور<input name="password" type="password" required minlength="6" autocomplete="${mode==='in'?'current-password':'new-password'}" dir="ltr"></label>
      <button class="btn block" id="ab">${mode==='in'?'دخول':'إنشاء الحساب'}</button>
      <p id="amsg" class="small" hidden></p>
    </form>
    <p class="small" style="text-align:center;margin-top:14px">
      ${mode==='in'?'ما عندك حساب؟':'عندك حساب؟'} <a href="#" id="sw" style="color:var(--brand);font-weight:600">${mode==='in'?'سجّل كموظف جديد':'سجّل دخول'}</a></p>
  </div>`;
  $('#sw').onclick=e=>{e.preventDefault();vAuth(mode==='in'?'up':'in')};
  $('#af').onsubmit=async e=>{e.preventDefault();const f=form(e.target),b=$('#ab'),m=$('#amsg');b.disabled=true;m.hidden=true;
    const bad=t=>{b.disabled=false;m.hidden=false;m.className='alert bad small';m.textContent=t};
    const nid=normDigits(f.nid);
    if(!/^[12]\d{9}$/.test(nid))return bad('رقم الهوية أو الإقامة لازم يكون 10 أرقام ويبدأ بـ 1 أو 2');
    let ph=null;
    if(mode==='up'){ph=normPhone(f.phone);if(!ph)return bad('اكتب رقم جوال سعودي صحيح، مثل 0501234567')}
    const email=nid+'@id.hr-app.com';
    let r;
    if(mode==='in') r=await sb.auth.signInWithPassword({email,password:f.password});
    else r=await sb.auth.signUp({email,password:f.password,options:{data:{full_name:f.full_name.trim(),phone:'0'+ph.slice(3),national_id:nid}}});
    b.disabled=false;
    if(r.error){m.hidden=false;m.className='alert bad small';m.textContent=authMsg(r.error.message);return}
    if(mode==='up'&&!r.data.session){m.hidden=false;m.className='alert info small';m.textContent='تم إنشاء الحساب. افتح الإيميل اللي وصلك واضغط رابط التفعيل، ثم ارجع وسجّل دخول.'}
  };
}
function normDigits(s){return String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g,'')}
function normPhone(s){
  s=normDigits(s);
  if(s.startsWith('00'))s=s.slice(2);
  if(s.startsWith('966'))s=s.slice(3);
  if(s.startsWith('0'))s=s.slice(1);
  return /^5\d{8}$/.test(s)?'966'+s:null;
}
function authMsg(m){
  if(/Invalid login/i.test(m))return 'رقم الهوية أو كلمة المرور غير صحيحة';
  if(/already registered/i.test(m))return 'رقم الهوية هذا مسجل من قبل، سجّل دخول';
  if(/Email not confirmed/i.test(m))return 'لازم تفعّل الإيميل أولاً من الرسالة اللي وصلتك';
  if(/Password should/i.test(m))return 'كلمة المرور لازم تكون 6 أحرف على الأقل';
  return m;
}

  const t=todayStr();

    <div class="small muted" id="pmsg">${br?`${I.pin.replace('<svg','<svg style="width:14px;height:14px;vertical-align:-2px"')} ${esc(br.name)}${sh?` · الدوام ${sh.start_time.slice(0,5)} - ${sh.end_time.slice(0,5)}`:''}`:''}</div>
    <div class="times">
      <div><b>${fmtTime(r?.check_in_at)}</b><span>الحضور</span></div>
      <div><b>${fmtTime(r?.check_out_at)}</b><span>الانصراف</span></div>
      <div><b>${r?.check_out_at?hm(r.worked_minutes):r?.check_in_at?'جارٍ':'—'}</b><span>ساعات العمل</span></div>

    ${r?.late_minutes>0?`<div style="margin-top:10px"><span class="pill p-warn">متأخر ${r.late_minutes} دقيقة</span></div>`:''}
  </section>
  <div id="hr-box"></div>
  <h2>آخر أيامك</h2><div class="card list" id="recent"><div class="empty"><span class="spin"></span></div></div>`;
  const tick=()=>{const c=$('#clk');if(c)c.textContent=new Date().toLocaleTimeString(LOC,{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit'})};tick();clockTimer=setInterval(tick,1000);

  $('#recent').innerHTML=(rows||[]).length?rows.map(attItem).join(''):'<div class="empty">ما فيه سجلات حضور للحين</div>';
  const mine=empAlerts(S.me);

function dayStatus(p,date,rec,leaves,holidays){
  if(rec)return rec.status;
  if(holidays.includes(date))return 'holiday';
  if(leaves.some(l=>l.employee_id===p.id&&date>=l.start_date&&date<=l.end_date))return 'leave';
  const sh=S.shifts.find(s=>s.id===p.shift_id);
  const dow=new Date(date+'T12:00:00Z').getUTCDay();
  if(sh&&!sh.work_days.includes(dow))return 'off';
  return 'absent';
}

async function aPayroll(box,re){
  const ym=S.sub.pm||monthNow();const [y,m]=ym.split('-').map(Number);
  let {data:run}=await sb.from('payroll_runs').select('*').eq('year',y).eq('month',m).maybeSingle();
  if((!run||run.status==='draft')&&!S.sub.noAuto){
    box.innerHTML='<div class="empty"><span class="spin"></span> جاري تحديث الحساب</div>';
    const {error}=await sb.rpc('generate_payroll',{p_year:y,p_month:m});
    if(!fail(error))({data:run}=await sb.from('payroll_runs').select('*').eq('year',y).eq('month',m).maybeSingle());
  }
  let slips=[];
  if(run){const {data}=await sb.from('payslips').select('*,profiles(full_name,iban,employee_no)').eq('run_id',run.id);slips=(data||[]).sort((a,b)=>a.profiles.full_name.localeCompare(b.profiles.full_name,'ar'))}
  const tot=slips.reduce((s,p)=>s+Number(p.net),0);
  box.innerHTML=`<h2>مسير الرواتب</h2><div class="grid2"><input type="month" id="pm" value="${ym}"><button class="btn ghost" id="gen" ${run&&run.status!=='draft'?'disabled':''}>تحديث الحساب</button></div>
   <p class="small muted">المسير يتحدث تلقائياً من الحضور كل ما تفتحه. الإضافات والخصومات اليدوية تبقى محفوظة. بعد الاعتماد ما يتغير.</p>
   ${run?`<div class="card"><div class="row between"><div><div class="muted small">الإجمالي · ${slips.length} موظف</div><div class="num" style="font:700 22px var(--display)">${money(tot)} ريال</div></div>${pill(PAY,run.status)}</div>
     <div class="row" style="margin-top:12px">${run.status==='draft'?'<button class="btn" id="apr">اعتماد المسير</button>':''}${run.status==='approved'?'<button class="btn" id="paid">تأكيد الصرف</button>':''}<button class="btn ghost" id="csv">ملف البنك (Excel)</button></div></div>
     <div class="card tbl" style="margin-top:12px"><table><thead><tr><th>الموظف</th><th>الإجمالي</th><th>التأخير</th><th>الغياب</th><th>تأمينات</th><th>إضافات</th><th>خصومات</th><th>الصافي</th></tr></thead><tbody>
     ${slips.map(p=>{const gross=Number(p.basic)+Number(p.housing)+Number(p.transport)+Number(p.other_allowances);const ro=run.status!=='draft'?'disabled':'';
      return `<tr><td>${esc(p.profiles.full_name)}</td><td class="num">${money(gross)}</td><td class="num">${p.late_minutes} د<br><b>${money(p.late_deduction)}</b></td><td class="num">${absText(p)}<br><b>${money(p.absence_deduction)}</b></td><td class="num">${money(p.gosi_deduction)}</td>
      <td><input type="number" step="0.01" value="${p.additions}" data-s="${p.id}" data-k="additions" ${ro}></td><td><input type="number" step="0.01" value="${p.other_deductions}" data-s="${p.id}" data-k="other_deductions" ${ro}></td><td class="num"><b>${money(p.net)}</b></td></tr>`}).join('')}
     </tbody></table></div>`:'<div class="card empty">ما فيه مسير لهذا الشهر. اضغط "إنشاء المسير".</div>'}`;
  $('#pm').onchange=e=>{S.sub.pm=e.target.value;aPayroll(box,re)};
  $('#gen').onclick=async e=>{e.target.disabled=true;e.target.innerHTML='<span class="spin"></span>';const {error}=await sb.rpc('generate_payroll',{p_year:y,p_month:m});if(!fail(error))toast('تم حساب المسير');aPayroll(box,re)};
  box.querySelectorAll('[data-s]').forEach(i=>i.onchange=async()=>{const {error}=await sb.from('payslips').update({[i.dataset.k]:Number(i.value||0)}).eq('id',i.dataset.s);if(!fail(error))aPayroll(box,re)});
  const setRun=async s=>{const {error}=await sb.from('payroll_runs').update({status:s}).eq('id',run.id);if(!fail(error)){toast(s==='approved'?'تم اعتماد المسير، يقدر الموظفين يشوفون قسائمهم':'تم تسجيل الصرف');aPayroll(box,re)}};
  $('#apr')&&($('#apr').onclick=()=>setRun('approved'));$('#paid')&&($('#paid').onclick=()=>setRun('paid'));
  $('#csv')&&($('#csv').onclick=()=>downloadCSV(`payroll-${ym}.csv`,[['الرقم الوظيفي','الاسم','الآيبان','الصافي'],...slips.map(p=>[p.profiles.employee_no,p.profiles.full_name,p.profiles.iban,Number(p.net).toFixed(2)])]));
}

/* ---------- التنبيهات والوثائق ---------- */
const ALERT_DEF={id_expiry:['الهوية / الإقامة',[30]],work_permit:['كرت العمل',[30,15]],medical:['التأمين الطبي',[20]],contract_end:['نهاية العقد',[60,30]],
  veh_registration:['استمارة المركبة',[30]],veh_insurance:['تأمين المركبة',[30]],veh_authorization:['تفويض المركبة',[30]],veh_inspection:['الفحص الدوري',[30]],
  cr_expiry:['السجل التجاري',[30]],cr_confirm:['التأكيد السنوي للسجل',[30]],license:['الرخص',[30]],gov_sub:['اشتراك حكومي',[30]],com_sub:['اشتراك تجاري',[30]],other:['وثائق أخرى',[30]]};
const DOC_KINDS={cr:'سجل تجاري',license:'رخصة',gov_sub:'اشتراك موقع حكومي',com_sub:'اشتراك موقع تجاري',other:'أخرى'};
function normDigits2(s){return String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))}
function alertDays(k){const v=S.settings?.alert_days?.[k];return (Array.isArray(v)&&v.length?v:ALERT_DEF[k][1]).slice().sort((a,b)=>b-a)}
function daysLeft(d){return Math.round((Date.parse(d+'T00:00:00Z')-Date.parse(todayStr()+'T00:00:00Z'))/864e5)}
function checkDate(date,key,title,sub,ref){
  if(!date)return null;const n=daysLeft(date),ds=alertDays(key);
  if(n>ds[0])return null;
  const stage=ds.filter(x=>n<=x).length;
  const lvl=n<0?'expired':(ds.length>1&&stage>=ds.length?'urgent':'soon');
  return {date,key,title,sub,ref,n,stage,lvl};
}
const dueText=n=>n<0?`منتهية منذ ${-n} يوم`:n===0?'تنتهي اليوم':`تنتهي بعد ${n} يوم`;
function empAlerts(p){if(!p||p.is_active===false)return [];
  return [checkDate(p.id_expiry,'id_expiry',p.national_id?.startsWith('2')?'الإقامة':'الهوية',p.full_name,{t:'emp',id:p.id}),
   checkDate(p.work_permit_expiry,'work_permit','كرت العمل',p.full_name,{t:'emp',id:p.id}),
   checkDate(p.medical_insurance_expiry,'medical','التأمين الطبي',p.full_name,{t:'emp',id:p.id}),
   checkDate(p.contract_end,'contract_end','نهاية العقد',p.full_name,{t:'emp',id:p.id})].filter(Boolean)}
function vehAlerts(v){const s=`${v.plate_no}${v.description?' · '+v.description:''}`,r={t:'veh',id:v.id};
  return [checkDate(v.registration_expiry,'veh_registration','استمارة المركبة',s,r),checkDate(v.insurance_expiry,'veh_insurance','تأمين المركبة',s,r),
   checkDate(v.authorization_expiry,'veh_authorization','تفويض المركبة',s,r),checkDate(v.inspection_expiry,'veh_inspection','الفحص الدوري',s,r)].filter(Boolean)}
function docAlerts(d){const r={t:'doc',id:d.id},s=d.name+(d.number?' · '+d.number:'');
  if(d.kind==='cr')return [checkDate(d.expiry_date,'cr_expiry','انتهاء السجل التجاري',s,r),checkDate(d.confirm_date,'cr_confirm','التأكيد السنوي للسجل',s,r)].filter(Boolean);
  return [checkDate(d.expiry_date,DOC_KINDS[d.kind]?(d.kind==='cr'?'cr_expiry':d.kind):'other',DOC_KINDS[d.kind]||'وثيقة',s,r)].filter(Boolean)}
async function collectAlerts(){
  if(!S.profiles.length)await loadProfiles();
  const [{data:veh},{data:docs}]=await Promise.all([sb.from('vehicles').select('*'),sb.from('company_docs').select('*')]);
  S.vehicles=veh||[];S.docs=docs||[];
  return [...S.profiles.flatMap(empAlerts),...S.vehicles.flatMap(vehAlerts),...S.docs.flatMap(docAlerts)].sort((a,b)=>a.n-b.n);
}
async function refreshAlertCount(){try{const a=await collectAlerts();const c=a.length;if(c!==S.alertCount){S.alertCount=c;drawNav()}}catch(e){}}
function alertRow(a){const cls=a.lvl==='expired'?'p-bad':a.lvl==='urgent'?'p-bad':'p-warn';
  const stage=a.lvl==='expired'?'منتهي':alertDays(a.key).length>1?(a.stage>=2?'التنبيه الثاني':'التنبيه الأول'):'تنبيه';
  return `<div class="item" data-go="${a.ref.t}:${a.ref.id}" style="cursor:pointer"><div class="main"><div class="t">${esc(a.title)}</div><div class="small muted">${esc(a.sub)} · ${fmtDate(a.date)}</div></div>
   <div style="text-align:left"><span class="pill ${cls}">${dueText(a.n)}</span><div class="small muted">${stage}</div></div></div>`}
async function aAlerts(box,re){
  const all=await collectAlerts();S.alertCount=all.length;drawNav();
  const grp=[['expired','منتهية'],['urgent','عاجل'],['soon','قريباً']];
  box.innerHTML=`<h2>التنبيهات</h2>${all.length?grp.map(([k,l])=>{const it=all.filter(a=>a.lvl===k);return it.length?`<h3 style="margin-top:14px">${l} (${it.length})</h3><div class="card list">${it.map(alertRow).join('')}</div>`:''}).join(''):'<div class="card empty">ما فيه أي وثيقة قريبة الانتهاء 👍</div>'}
   <p class="small muted">تقدر تعدّل مواعيد التنبيهات من الإعدادات.</p>`;
  box.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{const [t,id]=el.dataset.go.split(':');
    if(t==='emp')editEmp(S.profiles.find(p=>p.id===id),re);if(t==='veh')vehSheet(S.vehicles.find(v=>v.id===id),re);if(t==='doc')docSheet(S.docs.find(d=>d.id===id),re)});
}
function nextExp(list){const a=list.filter(Boolean).sort((x,y)=>x.n-y.n)[0];return a?`<span class="pill ${a.lvl==='soon'?'p-warn':'p-bad'}">${esc(a.title)} ${dueText(a.n)}</span>`:'<span class="pill p-ok">سارية</span>'}
async function aVeh(box,re){
  const {data}=await sb.from('vehicles').select('*').order('plate_no');S.vehicles=data||[];
  box.innerHTML=`<h2>المركبات (${S.vehicles.length})</h2><div class="card list">${S.vehicles.map(v=>`<div class="item" data-v="${v.id}" style="cursor:pointer"><div class="main"><div class="t">${esc(v.plate_no)} ${v.description?`<span class="muted small">· ${esc(v.description)}${v.model_year?' '+v.model_year:''}</span>`:''}</div>
     <div class="small muted">${v.assigned_to?'مفوّضة لـ '+esc(nameOf(v.assigned_to)):'بدون تفويض'}</div></div>${nextExp(vehAlerts(v))}</div>`).join('')||'<div class="empty">ما فيه مركبات مضافة</div>'}</div>
   <button class="btn block" id="addv" style="margin-top:10px">إضافة مركبة</button>`;
  $('#addv').onclick=()=>vehSheet(null,re);
  box.querySelectorAll('[data-v]').forEach(el=>el.onclick=()=>vehSheet(S.vehicles.find(v=>v.id===el.dataset.v),re));

    <div class="grid2"><label class="f">رقم اللوحة<input name="plate_no" required value="${esc(v?.plate_no||'')}" placeholder="أ ب ج 1234"></label>
    <label class="f">النوع / الموديل<input name="description" value="${esc(v?.description||'')}" placeholder="هايلكس"></label>

    <label class="f">انتهاء الفحص الدوري<input type="date" name="inspection_expiry" value="${v?.inspection_expiry||''}"></label></div>
    <label class="f">ملاحظات<textarea name="notes">${esc(v?.notes||'')}</textarea></label>
    <div class="row"><button class="btn" style="flex:1">حفظ</button>${v?'<button type="button" class="btn ghost" id="vdel">حذف</button>':''}<button type="button" class="btn ghost" id="vx">إغلاق</button></div></form>`,
  (el,close)=>{el.querySelector('#vx').onclick=close;
    el.querySelector('#vdel')&&(el.querySelector('#vdel').onclick=async()=>{if(!confirm('حذف المركبة؟'))return;const {error}=await sb.from('vehicles').delete().eq('id',v.id);if(!fail(error)){close();toast('تم الحذف');re()}});

async function aDocs(box,re){
  const {data}=await sb.from('company_docs').select('*').order('name');S.docs=data||[];
  box.innerHTML=`<h2>وثائق المنشأة</h2>${Object.entries(DOC_KINDS).map(([k,l])=>{const it=S.docs.filter(d=>(DOC_KINDS[d.kind]?d.kind:'other')===k);return it.length?`<h3 style="margin-top:14px">${l}</h3><div class="card list">${it.map(d=>`<div class="item" data-d="${d.id}" style="cursor:pointer"><div class="main"><div class="t">${esc(d.name)}</div><div class="small muted">${d.number?esc(d.number)+' · ':''}${d.expiry_date?'ينتهي '+fmtDate(d.expiry_date):''}${d.confirm_date?' · التأكيد السنوي '+fmtDate(d.confirm_date):''}</div></div>${nextExp(docAlerts(d))}</div>`).join('')}</div>`:''}).join('')||'<div class="card empty">ما فيه وثائق مضافة</div>'}
   <button class="btn block" id="addd" style="margin-top:12px">إضافة وثيقة</button>`;
  $('#addd').onclick=()=>docSheet(null,re);
  box.querySelectorAll('[data-d]').forEach(el=>el.onclick=()=>docSheet(S.docs.find(d=>d.id===el.dataset.d),re));

    <label class="f">الرقم (اختياري)<input name="number" value="${esc(d?.number||'')}" dir="ltr"></label>

/* ---------- خريطة الفروع ---------- */
let leafletP;
function loadLeaflet(){
  if(window.L)return Promise.resolve();
  if(leafletP)return leafletP;
  leafletP=new Promise((res,rej)=>{
    const css=document.createElement('link');css.rel='stylesheet';css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(css);
    const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';s.onload=res;s.onerror=()=>{leafletP=null;rej()};document.head.appendChild(s);
  });
  return leafletP;
}
function parseCoords(t){
  t=normDigitsKeep(String(t||''));
  const pats=[/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/,/[?&](?:q|query|ll|center|destination)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i,/(-?\d{1,2}\.\d+)\s*[,،]\s*(-?\d{1,3}\.\d+)/];
  for(const p of pats){const m=t.match(p);if(m){const a=+m[1],b=+m[2];if(Math.abs(a)<=90&&Math.abs(b)<=180)return [a,b]}}
  return null;
}
function normDigitsKeep(s){return s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.')}
function branchSheet(b,after){
  const lat0=b?.latitude??24.7136,lng0=b?.longitude??46.6753;
  sheet(`<form id="bsf" class="stack">
    <h3>${b?'تعديل الفرع':'فرع جديد'}</h3>
    <label class="f">اسم الفرع<input name="name" required value="${esc(b?.name||'')}" placeholder="المقر الرئيسي"></label>
    <div class="row" style="flex-wrap:nowrap"><input id="bq" placeholder="ابحث عن حي أو مكان أو الصق رابط قوقل ماب" style="flex:1"><button type="button" class="btn ghost sm" id="bqs">بحث</button></div>
    <div id="bres" class="list small" hidden></div>
    <div id="bmap" style="height:300px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:var(--surface-2)"><div class="empty"><span class="spin"></span> جاري تحميل الخريطة</div></div>
    <button type="button" class="btn ghost" id="bhere">${I.pin.replace('<svg','<svg style="width:16px;height:16px;vertical-align:-3px"')} موقعي الحالي (إذا كنت في الفرع)</button>
    <p class="small muted" style="margin:0">اسحب الدبوس الأحمر أو اضغط على الخريطة لين يصير على مبنى الفرع بالضبط. الدائرة هي النطاق اللي يقدر الموظف يبصم منه.</p>
    <label class="f">نطاق البصمة: <b id="rv" class="num">${b?.radius_m||150}</b> متر<input type="range" name="radius_m" id="br" min="30" max="1000" step="10" value="${b?.radius_m||150}" style="padding:0"></label>
    <div class="row"><button class="btn" style="flex:1">${b?'حفظ التعديل':'إضافة الفرع'}</button><button type="button" class="btn ghost" id="bx">إلغاء</button></div>
  </form>`,
  async (el,close)=>{
    el.querySelector('#bx').onclick=close;
    let pos=[lat0,lng0],map,marker,circle;
    const rIn=el.querySelector('#br'),rv=el.querySelector('#rv');
    const setPos=(p,zoom)=>{pos=p;if(!map)return;marker.setLatLng(p);circle.setLatLng(p);if(zoom)map.setView(p,zoom);else map.panTo(p)};
    rIn.oninput=()=>{rv.textContent=rIn.value;circle&&circle.setRadius(+rIn.value)};
    try{await loadLeaflet()}catch(e){el.querySelector('#bmap').innerHTML='<div class="alert bad">تعذر تحميل الخريطة، تأكد من الإنترنت وحاول مرة ثانية</div>';return}
    const mEl=el.querySelector('#bmap');mEl.innerHTML='';
    map=L.map(mEl,{zoomControl:true,attributionControl:true}).setView(pos,b?17:12);
    const sat=L.layerGroup([
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:19,attribution:'Esri, Maxar'}),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:.7})]);
    const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
    sat.addTo(map);
    L.control.layers({'أقمار صناعية':sat,'خريطة':street},null,{position:'topright',collapsed:false}).addTo(map);
    const icon=L.divIcon({className:'',html:'<div style="width:26px;height:26px;border-radius:50% 50% 50% 0;background:#d23c2f;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)"></div>',iconSize:[26,26],iconAnchor:[13,26]});
    marker=L.marker(pos,{draggable:true,icon}).addTo(map);
    circle=L.circle(pos,{radius:+rIn.value,color:'#ffd23f',fillColor:'#ffd23f',fillOpacity:.18,weight:3}).addTo(map);
    marker.on('drag',e=>{pos=[e.latlng.lat,e.latlng.lng];circle.setLatLng(e.latlng)});
    map.on('click',e=>setPos([e.latlng.lat,e.latlng.lng]));
    setTimeout(()=>map.invalidateSize(),250);
    el.querySelector('#bhere').onclick=async e=>{const btn=e.currentTarget;btn.disabled=true;
      try{const p=await getPos();setPos([p.coords.latitude,p.coords.longitude],18);toast(`تم تحديد موقعك (دقة ±${Math.round(p.coords.accuracy)} م)`)}catch(err){toast(geoErr(err),'bad')}btn.disabled=false};
    const res=el.querySelector('#bres');
    const search=async()=>{const q=el.querySelector('#bq').value.trim();if(!q)return;
      const c=parseCoords(q);if(c){setPos(c,18);res.hidden=true;toast('تم تحديد الموقع من الرابط');return}
      if(/goo\.gl|maps\.app/i.test(q)){res.hidden=false;res.innerHTML='<div class="alert warn">الروابط المختصرة ما تنقرأ. في قوقل ماب اضغط مطولاً على مكان الفرع، وانسخ الأرقام اللي تطلع فوق (مثل 24.71, 46.67) والصقها هنا.</div>';return}
      res.hidden=false;res.innerHTML='<div class="empty"><span class="spin"></span></div>';
      try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=sa&accept-language=ar&q='+encodeURIComponent(q));const d=await r.json();
        if(!d.length){res.innerHTML='<div class="empty">ما لقينا نتائج، جرّب اسم الحي أو المدينة</div>';return}
        res.innerHTML=d.map((x,i)=>`<div class="item" data-i="${i}" style="cursor:pointer;padding:8px 0">${esc(x.display_name)}</div>`).join('');
        res.querySelectorAll('[data-i]').forEach(it=>it.onclick=()=>{const x=d[+it.dataset.i];setPos([+x.lat,+x.lon],17);res.hidden=true});
      }catch(e){res.innerHTML='<div class="alert bad">تعذر البحث، حاول مرة ثانية</div>'}};
    el.querySelector('#bqs').onclick=search;
    el.querySelector('#bq').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search()}};
    el.querySelector('#bsf').onsubmit=async e=>{e.preventDefault();
      const row={name:e.target.name.value.trim(),latitude:+pos[0].toFixed(6),longitude:+pos[1].toFixed(6),radius_m:+rIn.value};
      const {error}=b?await sb.from('branches').update(row).eq('id',b.id):await sb.from('branches').insert(row);
      if(fail(error))return;close();after(b?'تم حفظ الفرع':'تمت إضافة الفرع')};
  });
}

/* ---------- التشغيل ---------- */
let booted=null;
async function boot(session){
  if(!session){S.me=null;booted=null;vAuth();return}
  if(booted===session.user.id)return;booted=session.user.id;
  try{await Promise.all([loadMe(session.user.id),loadRefs()]);
    if(!S.me){app.innerHTML='<div class="alert warn" style="margin-top:20vh">ما لقينا ملف الموظف الخاص بك. تواصل مع الموارد البشرية.</div>';nav.hidden=true;return}
    if(!S.me.is_active){app.innerHTML='<div class="alert bad" style="margin-top:20vh">حسابك موقوف. تواصل مع الموارد البشرية.</div><button class="btn ghost" style="margin-top:12px" onclick="sb.auth.signOut()">خروج</button>';nav.hidden=true;return}
    if(isHR()){await loadProfiles();refreshAlertCount()}
    render();
  }catch(e){booted=null;app.innerHTML=`<div class="alert bad" style="margin-top:20vh">تعذر الاتصال: ${esc(e.message)}</div>`}
}
sb.auth.onAuthStateChange((_e,session)=>{setTimeout(()=>boot(session),0)});

let installEvt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAndroid=/android/i.test(navigator.userAgent);
function dismissedRecently(){try{return Date.now()-Number(localStorage.getItem('instHide')||0)<3*864e5}catch(e){return false}}
function drawInstall(){
  const box=document.getElementById('inst');
  if(isStandalone()||dismissedRecently()||!(isIOS||isAndroid||installEvt)){box.hidden=true;return}
  const icon=document.querySelector('link[rel=apple-touch-icon]').href;
  box.hidden=false;
  box.innerHTML=`<div class="inst"><img src="${icon}" alt=""><div class="tx"><b>ثبّت التطبيق على جوالك</b>عشان تفتحه بضغطة من الشاشة الرئيسية</div>
    <button class="go" id="instGo">${installEvt?'تثبيت':'طريقة الإضافة'}</button><button class="x" id="instX" aria-label="إخفاء">×</button></div>`;
  document.getElementById('instX').onclick=()=>{try{localStorage.setItem('instHide',Date.now())}catch(e){}box.hidden=true};
  document.getElementById('instGo').onclick=async()=>{
    if(installEvt){installEvt.prompt();const r=await installEvt.userChoice;installEvt=null;if(r.outcome==='accepted')box.hidden=true;else drawInstall();return}
    showInstallSteps();
  };
}
function showInstallSteps(){
  const share='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
  const plus='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
  const dots='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
  const inApp=/FBAN|FBAV|Instagram|WhatsApp|Snapchat|Line\//i.test(navigator.userAgent);
  const steps=isIOS?[
      [share,'اضغط زر <b>المشاركة</b>','في Safari: اضغط زر ••• تحت، وبعدها <b>مشاركة</b>'],
      [plus,'اختر <b>إضافة إلى الشاشة الرئيسية</b>','إذا ما لقيتها، اسحب القائمة لتحت'],
      ['✓','اضغط <b>إضافة</b>','فوق يمين، ويصير التطبيق على شاشتك']]
    :[[dots,'اضغط <b>النقاط الثلاث</b>','فوق يمين في متصفح Chrome'],
      [plus,'اختر <b>إضافة إلى الشاشة الرئيسية</b>','أو "تثبيت التطبيق"'],
      ['✓','اضغط <b>إضافة</b>','ويصير التطبيق على شاشتك']];
  sheet(`<h3>إضافة التطبيق للشاشة الرئيسية</h3>
    ${inApp?`<div class="alert warn small" style="margin-bottom:8px">فتحت الرابط من داخل تطبيق ثاني. افتحه أولاً في ${isIOS?'Safari':'Chrome'} من زر القائمة، وبعدها سوّ الخطوات.</div>`:''}
    <div>${steps.map((s,i)=>`<div class="ios-step"><span class="n">${i+1}</span><span class="ic">${s[0]}</span><div><div>${s[1]}</div><div class="small muted">${s[2]}</div></div></div>`).join('')}</div>
    <button class="btn block" id="okI" style="margin-top:12px">تمام</button>`,(el,close)=>{el.querySelector('#okI').onclick=close});
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;drawInstall()});
window.addEventListener('appinstalled',()=>{document.getElementById('inst').hidden=true});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
drawInstall();
</script>
</body>
</html>
