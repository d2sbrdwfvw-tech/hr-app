<style>
/* تخطيط: تطبيق جوال بعمود واحد، شريط تنقل سفلي، وزر بصمة كبير في الرئيسية */
:root{
  --bg:#f2f5f6; --surface:#ffffff; --surface-2:#f7f9fa; --ink:#10202b; --muted:#5d6d78; --line:#dde4e8;
  --brand:#0e5c63; --brand-ink:#ffffff; --brand-soft:#e2efef;
  --ok:#1d7f48; --ok-soft:#e3f3e9; --warn:#a8650c; --warn-soft:#fbf0dd; --bad:#b4322a; --bad-soft:#f9e4e2;
  --font:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1418; --surface:#142027; --surface-2:#1a2830; --ink:#e5edf1; --muted:#93a5b0; --line:#253640;
  --brand:#43b5ab; --brand-ink:#05201f; --brand-soft:#123533;
  --ok:#4cc483; --ok-soft:#123222; --warn:#e3a54a; --warn-soft:#3a2a10; --bad:#ec7a70; --bad-soft:#3b1a17; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 4px}
header.top h1{font:700 18px/1.3 var(--display);margin:0;text-wrap:balance}
header.top .sub{color:var(--muted);font-size:13px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:13px;cursor:pointer}
h2{font:700 17px/1.4 var(--display);margin:18px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.num{font-variant-numeric:tabular-nums;font-family:var(--display)}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--brand);color:var(--brand-ink);font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input[type=checkbox]{width:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--brand-soft);color:var(--brand)}
.p-mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main{min-width:0;flex:1}
.item .t{font-weight:600}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.alert{border-radius:12px;padding:12px 14px;font-size:14px}
.alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.info{background:var(--brand-soft);color:var(--brand)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}

/* بطاقة البصمة */
.punch{text-align:center;padding:22px 16px}
.clock{font:700 44px/1.1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:1px}
.date{color:var(--muted);margin-top:4px}
.punch-btn{margin:20px auto 8px;width:168px;height:168px;border-radius:50%;border:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:700 17px var(--display);
  background:var(--brand);color:var(--brand-ink);box-shadow:0 0 0 10px var(--brand-soft)}
.punch-btn.out{background:var(--warn);color:#fff;box-shadow:0 0 0 10px var(--warn-soft)}
.punch-btn.done{background:var(--surface-2);color:var(--muted);box-shadow:0 0 0 10px var(--line);cursor:default}
.punch-btn svg{width:40px;height:40px}
.times{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.times div{background:var(--surface-2);border-radius:10px;padding:8px 4px}
.times b{display:block;font:600 16px var(--display);font-variant-numeric:tabular-nums}
.times span{font-size:12px;color:var(--muted)}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font:700 24px/1.2 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:4px 0 8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;background:var(--brand);border-radius:6px 6px 2px 2px;min-height:2px}
.bars .b small{font-size:11px;color:var(--muted)}
.bars .b em{font-style:normal;font-size:12px;font-variant-numeric:tabular-nums}

.slip .line{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.slip .line.neg span:last-child{color:var(--bad)}
.slip .net{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;font-weight:700}

.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:500}
td input{padding:6px 8px;width:90px}

nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
nav.bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11px;color:var(--muted);padding:6px 2px;cursor:pointer;border-radius:10px}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button.on{color:var(--brand);font-weight:600}

.sheet-bg{position:fixed;inset:0;background:rgba(5,15,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;text-align:center}
.toast.bad{background:var(--bad);color:#fff}

.auth{max-width:420px;margin:8vh auto 0}
.auth .logo{width:64px;height:64px;border-radius:18px;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.auth h1{font:700 24px/1.3 var(--display);margin:0 0 4px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

<script>

/* ---------- أدوات ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const LOC='ar-SA-u-ca-gregory-nu-latn';

const fmtTime=t=>t?new Date(t).toLocaleTimeString(LOC,{timeZone:TZ,hour:'2-digit',minute:'2-digit'}):'—';
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString(LOC,{weekday:'short',day:'numeric',month:'short'}):'—';
const fmtLong=d=>new Date(d+'T12:00:00').toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const money=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const hm=m=>{m=Math.max(0,m|0);return `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`};
const monthNow=()=>todayStr().slice(0,7);
const monthRange=ym=>{const [y,m]=ym.split('-').map(Number);const last=new Date(Date.UTC(y,m,0)).getUTCDate();return [`${ym}-01`,`${ym}-${String(last).padStart(2,'0')}`]};
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const ROLES={employee:'موظف',manager:'مدير',hr:'موارد بشرية',admin:'مدير النظام'};
const ATT={present:['حاضر','p-ok'],late:['متأخر','p-warn'],absent:['غائب','p-bad'],leave:['إجازة','p-info'],holiday:['عطلة','p-mute']};
const RQ={pending:['قيد المراجعة','p-warn'],approved:['مقبول','p-ok'],rejected:['مرفوض','p-bad'],cancelled:['ملغي','p-mute']};
const KINDS={salary_certificate:'تعريف بالراتب',advance:'سلفة',experience_letter:'شهادة خبرة',other:'طلب آخر'};
const PAY={draft:['مسودة','p-mute'],approved:['معتمد','p-info'],paid:['تم الصرف','p-ok']};
const pill=(map,k)=>{const v=map[k]||[k,'p-mute'];return `<span class="pill ${v[1]}">${esc(v[0])}</span>`};
const isHR=()=>['hr','admin'].includes(S.me?.role);
const isMgr=()=>S.me?.role==='manager';
const nameOf=id=>S.profiles.find(p=>p.id===id)?.full_name||'—';

function toast(msg,kind){const t=document.createElement('div');t.className='toast'+(kind==='bad'?' bad':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),kind==='bad'?4500:2600)}
function fail(error){if(error){toast(error.message||'حدث خطأ','bad');return true}return false}
function sheet(html,onMount){const bg=document.createElement('div');bg.className='sheet-bg';bg.innerHTML=`<div class="sheet">${html}</div>`;
  bg.addEventListener('click',e=>{if(e.target===bg)bg.remove()});document.body.appendChild(bg);onMount&&onMount(bg.querySelector('.sheet'),()=>bg.remove());return bg}
function form(el){const o={};el.querySelectorAll('[name]').forEach(i=>{o[i.name]=i.type==='checkbox'?i.checked:(i.value===''?null:i.value)});return o}
function downloadCSV(name,rows){const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function getPos(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej({code:0});
  navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:20000,maximumAge:0})})}
function geoErr(e){return e.code===1?'لازم تسمح للتطبيق بالوصول لموقعك من إعدادات المتصفح ثم تحاول مرة ثانية':e.code===3?'تأخر تحديد الموقع، تأكد إن الـ GPS شغال وحاول مرة ثانية':'تعذر تحديد موقعك، شغّل خدمات الموقع وحاول مرة ثانية'}
const opts=(arr,sel,empty='— اختر —')=>`<option value="">${empty}</option>`+arr.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name||x.full_name)}</option>`).join('');

const I={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
 pay:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
 team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.3"/><path d="M16 15c3 0 5 1.6 5 4"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg>',
 pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
 finger:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 11a5 5 0 0 1 10 0v2"/><path d="M12 11v6a3 3 0 0 0 1 2"/><path d="M9.5 11.5V15c0 2 .6 3.6 1.6 5"/><path d="M14.5 13v1.5c0 1.6.5 3 1.3 4"/><path d="M4.5 9a8 8 0 0 1 15 0"/></svg>'
};

/* ---------- البيانات المرجعية ---------- */
async function loadRefs(){
  const [st,br,sh,dp,lt]=await Promise.all([
    sb.from('settings').select('*').maybeSingle(),sb.from('branches').select('*').order('name'),
    sb.from('shifts').select('*').order('name'),sb.from('departments').select('*').order('name'),
    sb.from('leave_types').select('*').order('name')]);
  S.settings=st.data||{};S.branches=br.data||[];S.shifts=sh.data||[];S.departments=dp.data||[];S.leaveTypes=lt.data||[];
}
async function loadProfiles(){const {data}=await sb.from('profiles').select('*').order('full_name');S.profiles=data||[]}
async function loadMe(uid){const {data,error}=await sb.from('profiles').select('*').eq('id',uid).maybeSingle();if(error)throw error;S.me=data}

/* ---------- تسجيل الدخول ---------- */
function vAuth(mode='in'){
  nav.hidden=true;
  app.innerHTML=`<div class="auth">
    <div class="logo">${I.finger}</div>
    <h1>${mode==='in'?'تسجيل الدخول':'حساب موظف جديد'}</h1>
    <p class="muted">${mode==='in'?'ادخل برقم الهوية أو الإقامة وكلمة المرور':'سجّل بياناتك، وبعدها تفعّل الموارد البشرية حسابك'}</p>
    <form id="af" class="stack card">
      ${mode==='up'?'<label class="f">الاسم الكامل<input name="full_name" required autocomplete="name"></label>':''}
      <label class="f">رقم الهوية أو الإقامة<input name="nid" required inputmode="numeric" autocomplete="username" placeholder="10 أرقام" dir="ltr"></label>
      ${mode==='up'?'<label class="f">رقم الجوال<input name="phone" type="tel" required inputmode="tel" autocomplete="tel" placeholder="05XXXXXXXX" dir="ltr"></label>':''}
      <label class="f">كلمة المرور<input name="password" type="password" required minlength="6" autocomplete="${mode==='in'?'current-password':'new-password'}" dir="ltr"></label>
      <button class="btn block" id="ab">${mode==='in'?'دخول':'إنشاء الحساب'}</button>
      <p id="amsg" class="small" hidden></p>
    </form>
    <p class="small" style="text-align:center;margin-top:14px">
      ${mode==='in'?'ما عندك حساب؟':'عندك حساب؟'} <a href="#" id="sw" style="color:var(--brand);font-weight:600">${mode==='in'?'سجّل كموظف جديد':'سجّل دخول'}</a></p>
  </div>`;
  $('#sw').onclick=e=>{e.preventDefault();vAuth(mode==='in'?'up':'in')};
  $('#af').onsubmit=async e=>{e.preventDefault();const f=form(e.target),b=$('#ab'),m=$('#amsg');b.disabled=true;m.hidden=true;
    const bad=t=>{b.disabled=false;m.hidden=false;m.className='alert bad small';m.textContent=t};
    const nid=normDigits(f.nid);
    if(!/^[12]\d{9}$/.test(nid))return bad('رقم الهوية أو الإقامة لازم يكون 10 أرقام ويبدأ بـ 1 أو 2');
    let ph=null;
    if(mode==='up'){ph=normPhone(f.phone);if(!ph)return bad('اكتب رقم جوال سعودي صحيح، مثل 0501234567')}
    const email=nid+'@id.hr-app.com';
    let r;
    if(mode==='in') r=await sb.auth.signInWithPassword({email,password:f.password});
    else r=await sb.auth.signUp({email,password:f.password,options:{data:{full_name:f.full_name.trim(),phone:'0'+ph.slice(3),national_id:nid}}});
    b.disabled=false;
    if(r.error){m.hidden=false;m.className='alert bad small';m.textContent=authMsg(r.error.message);return}
    if(mode==='up'&&!r.data.session){m.hidden=false;m.className='alert info small';m.textContent='تم إنشاء الحساب. افتح الإيميل اللي وصلك واضغط رابط التفعيل، ثم ارجع وسجّل دخول.'}
  };
}
function normDigits(s){return String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g,'')}
function normPhone(s){
  s=normDigits(s);
  if(s.startsWith('00'))s=s.slice(2);
  if(s.startsWith('966'))s=s.slice(3);
  if(s.startsWith('0'))s=s.slice(1);
  return /^5\d{8}$/.test(s)?'966'+s:null;
}
function authMsg(m){
  if(/Invalid login/i.test(m))return 'رقم الهوية أو كلمة المرور غير صحيحة';
  if(/already registered/i.test(m))return 'رقم الهوية هذا مسجل من قبل، سجّل دخول';
  if(/Email not confirmed/i.test(m))return 'لازم تفعّل الإيميل أولاً من الرسالة اللي وصلتك';
  if(/Password should/i.test(m))return 'كلمة المرور لازم تكون 6 أحرف على الأقل';
  return m;
}

/* ---------- الهيكل ---------- */
function tabs(){
  const t=[['home','الرئيسية',I.home],['mine','سجلي',I.clock],['req','طلباتي',I.doc],['pay','رواتبي',I.pay]];
  if(isHR())t.push(['admin','الإدارة',I.team]); else if(isMgr())t.push(['appr','الموافقات',I.check]);
  return t;
}
function drawNav(){nav.hidden=false;nav.innerHTML=tabs().map(([k,l,ic])=>`<button data-t="${k}" class="${S.tab===k?'on':''}">${ic}<span>${l}</span></button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render();window.scrollTo(0,0)})}
function header(){return `<header class="top"><div><h1>${esc(S.settings?.company_name||'الموارد البشرية')}</h1>
  <div class="sub">${esc(S.me.full_name)} · ${ROLES[S.me.role]}</div></div>
  <button class="icon-btn" id="lo">خروج</button></header>`}
let clockTimer;
async function render(){
  clearInterval(clockTimer);drawNav();
  app.innerHTML=header()+'<main id="v"><div class="empty"><span class="spin"></span></div></main>';
  $('#lo').onclick=async()=>{await sb.auth.signOut()};
  const v=$('#v');
  try{({home:vHome,mine:vMine,req:vReq,pay:vPay,admin:vAdmin,appr:vAppr}[S.tab]||vHome)(v)}catch(e){v.innerHTML=`<div class="alert bad">${esc(e.message)}</div>`}
}

/* ---------- الرئيسية ---------- */
async function vHome(v){
  const t=todayStr();
  const [{data:rec},{data:open}]=await Promise.all([
    sb.from('attendance').select('*').eq('employee_id',S.me.id).eq('work_date',t).maybeSingle(),
    sb.from('attendance').select('*').eq('employee_id',S.me.id).not('check_in_at','is',null).is('check_out_at',null).order('check_in_at',{ascending:false}).limit(1)]);
  const openRec=(open||[])[0];
  const br=S.branches.find(b=>b.id===S.me.branch_id),sh=S.shifts.find(s=>s.id===S.me.shift_id);
  let state='in';if(openRec)state='out';else if(rec)state='done';
  const r=openRec||rec;
  const label={in:'تسجيل الحضور',out:'تسجيل الانصراف',done:'تم اليوم'}[state];
  v.innerHTML=`
  ${!br?`<div class="alert warn" style="margin-top:8px">حسابك بانتظار التفعيل. الموارد البشرية لازم تحدد فرعك ووردية دوامك قبل ما تقدر تسجل حضور.</div>`:''}
  <section class="card punch" style="margin-top:10px">
    <div class="clock" id="clk">--:--</div>
    <div class="date">${fmtLong(t)}</div>
    <button class="punch-btn ${state==='out'?'out':state==='done'?'done':''}" id="pb" ${state==='done'||!br?'disabled':''}>${I.finger}<span>${label}</span></button>
    <div class="small muted" id="pmsg">${br?`${I.pin.replace('<svg','<svg style="width:14px;height:14px;vertical-align:-2px"')} ${esc(br.name)}${sh?` · الدوام ${sh.start_time.slice(0,5)} - ${sh.end_time.slice(0,5)}`:''}`:''}</div>
    <div class="times">
      <div><b>${fmtTime(r?.check_in_at)}</b><span>الحضور</span></div>
      <div><b>${fmtTime(r?.check_out_at)}</b><span>الانصراف</span></div>
      <div><b>${r?.check_out_at?hm(r.worked_minutes):r?.check_in_at?'جارٍ':'—'}</b><span>ساعات العمل</span></div>
    </div>
    ${r?.late_minutes>0?`<div style="margin-top:10px"><span class="pill p-warn">متأخر ${r.late_minutes} دقيقة</span></div>`:''}
  </section>
  <div id="hr-box"></div>
  <h2>آخر أيامك</h2><div class="card list" id="recent"><div class="empty"><span class="spin"></span></div></div>`;
  const tick=()=>{const c=$('#clk');if(c)c.textContent=new Date().toLocaleTimeString(LOC,{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit'})};tick();clockTimer=setInterval(tick,1000);
  const pb=$('#pb');if(pb&&state!=='done')pb.onclick=()=>punch(state);
  const {data:rows}=await sb.from('attendance').select('*').eq('employee_id',S.me.id).order('work_date',{ascending:false}).limit(5);
  $('#recent').innerHTML=(rows||[]).length?rows.map(attItem).join(''):'<div class="empty">ما فيه سجلات حضور للحين</div>';
  if(isHR())hrQuick($('#hr-box'));
}
function attItem(a){return `<div class="item"><div class="main"><div class="t">${fmtDate(a.work_date)}</div>
  <div class="small muted num">${fmtTime(a.check_in_at)} ← ${fmtTime(a.check_out_at)}${a.worked_minutes?` · ${hm(a.worked_minutes)} ساعة`:''}</div></div>
  <div>${pill(ATT,a.status)}${a.late_minutes>0?`<div class="small muted num" style="text-align:left">${a.late_minutes} د</div>`:''}</div></div>`}
async function punch(kind){
  const pb=$('#pb'),m=$('#pmsg');pb.disabled=true;const old=pb.innerHTML;pb.innerHTML='<span class="spin"></span><span>جاري تحديد موقعك</span>';
  let pos;try{pos=await getPos()}catch(e){toast(geoErr(e),'bad');pb.disabled=false;pb.innerHTML=old;return}
  const {error}=await sb.rpc(kind==='in'?'check_in':'check_out',{p_lat:pos.coords.latitude,p_lng:pos.coords.longitude});
  if(fail(error)){pb.disabled=false;pb.innerHTML=old;if(pos.coords.accuracy>100)m.textContent=`دقة الموقع الحالية ضعيفة (±${Math.round(pos.coords.accuracy)} م). اطلع لمكان مفتوح أو شغّل الواي فاي وحاول مرة ثانية.`;return}
  toast(kind==='in'?'تم تسجيل حضورك ✓':'تم تسجيل انصرافك ✓');render();
}
async function hrQuick(box){
  const t=todayStr();
  const [{count:emp},{data:att},{count:pl},{count:pr}]=await Promise.all([
    sb.from('profiles').select('id',{count:'exact',head:true}).eq('is_active',true),
    sb.from('attendance').select('status').eq('work_date',t),
    sb.from('leave_requests').select('id',{count:'exact',head:true}).eq('status','pending'),
    sb.from('employee_requests').select('id',{count:'exact',head:true}).eq('status','pending')]);
  const present=(att||[]).length,late=(att||[]).filter(a=>a.status==='late').length;

function dayStatus(p,date,rec,leaves,holidays){
  if(rec)return rec.status;
  if(holidays.includes(date))return 'holiday';
  if(leaves.some(l=>l.employee_id===p.id&&date>=l.start_date&&date<=l.end_date))return 'leave';
  const sh=S.shifts.find(s=>s.id===p.shift_id);
  const dow=new Date(date+'T12:00:00Z').getUTCDay();
  if(sh&&!sh.work_days.includes(dow))return 'off';
  return 'absent';
}

    <label class="f">رقم الهوية / الإقامة<input value="${esc(p.national_id||'')}" dir="ltr" disabled></label>
    <label class="f">انتهاء الهوية / الإقامة<input type="date" name="id_expiry" value="${p.id_expiry||''}"></label>
    <label class="f">القسم${sel('department_id',S.departments,p.department_id)}</label><label class="f">الفرع (موقع البصمة)${sel('branch_id',S.branches,p.branch_id)}</label>
    <label class="f">الوردية${sel('shift_id',S.shifts,p.shift_id)}</label><label class="f">المدير المباشر${sel('manager_id',S.profiles.filter(x=>x.id!==p.id),p.manager_id)}</label>
    <label class="f">الصلاحية<select name="role">${Object.entries(ROLES).map(([k,l])=>`<option value="${k}" ${p.role===k?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="f">تاريخ التعيين<input type="date" name="hire_date" value="${p.hire_date||''}"></label>
    <label class="f">الجنسية<input name="nationality" value="${esc(p.nationality||'')}"></label>
    <label class="f">الآيبان<input name="iban" value="${esc(p.iban||'')}" dir="ltr"></label></div>
    <h3 style="margin-top:6px">الراتب الشهري (ريال)</h3>
    <div class="grid2"><label class="f">الأساسي<input type="number" step="0.01" name="basic_salary" value="${p.basic_salary}" inputmode="decimal"></label><label class="f">بدل السكن<input type="number" step="0.01" name="housing_allowance" value="${p.housing_allowance}" inputmode="decimal"></label>
    <label class="f">بدل النقل<input type="number" step="0.01" name="transport_allowance" value="${p.transport_allowance}" inputmode="decimal"></label><label class="f">بدلات أخرى<input type="number" step="0.01" name="other_allowance" value="${p.other_allowance}" inputmode="decimal"></label></div>
    <label class="row small"><input type="checkbox" name="is_saudi" ${p.is_saudi?'checked':''}> سعودي (يُخصم عليه التأمينات الاجتماعية)</label>
    <label class="row small"><input type="checkbox" name="is_active" ${p.is_active?'checked':''}> الحساب نشط</label>
    <div class="row"><button class="btn" style="flex:1">حفظ</button><button type="button" class="btn ghost" id="ex">إغلاق</button></div></form>`,
  (el,close)=>{el.querySelector('#ex').onclick=close;el.querySelector('#ef').onsubmit=async e=>{e.preventDefault();const f=form(e.target);
    ['basic_salary','housing_allowance','transport_allowance','other_allowance'].forEach(k=>f[k]=Number(f[k]||0));
    const {error}=await sb.from('profiles').update(f).eq('id',p.id);if(fail(error))return;close();toast('تم حفظ بيانات الموظف');if(p.id===S.me.id)await loadMe(p.id);re()}});
}

async function aPayroll(box,re){
  const ym=S.sub.pm||monthNow();const [y,m]=ym.split('-').map(Number);
  const {data:run}=await sb.from('payroll_runs').select('*').eq('year',y).eq('month',m).maybeSingle();
  let slips=[];
  if(run){const {data}=await sb.from('payslips').select('*,profiles(full_name,iban,employee_no)').eq('run_id',run.id);slips=(data||[]).sort((a,b)=>a.profiles.full_name.localeCompare(b.profiles.full_name,'ar'))}
  const tot=slips.reduce((s,p)=>s+Number(p.net),0);
  box.innerHTML=`<h2>مسير الرواتب</h2><div class="grid2"><input type="month" id="pm" value="${ym}"><button class="btn" id="gen" ${run&&run.status!=='draft'?'disabled':''}>${run?'إعادة الحساب':'إنشاء المسير'}</button></div>
   <p class="small muted">يحسب النظام الغياب والتأخير والتأمينات تلقائياً من سجلات الحضور. تقدر تضيف إضافات أو خصومات يدوية لكل موظف قبل الاعتماد.</p>
   ${run?`<div class="card"><div class="row between"><div><div class="muted small">الإجمالي · ${slips.length} موظف</div><div class="num" style="font:700 22px var(--display)">${money(tot)} ريال</div></div>${pill(PAY,run.status)}</div>
     <div class="row" style="margin-top:12px">${run.status==='draft'?'<button class="btn" id="apr">اعتماد المسير</button>':''}${run.status==='approved'?'<button class="btn" id="paid">تأكيد الصرف</button>':''}<button class="btn ghost" id="csv">ملف البنك (Excel)</button></div></div>
     <div class="card tbl" style="margin-top:12px"><table><thead><tr><th>الموظف</th><th>الإجمالي</th><th>غياب</th><th>تأخير</th><th>تأمينات</th><th>إضافات</th><th>خصومات</th><th>الصافي</th></tr></thead><tbody>
     ${slips.map(p=>{const gross=Number(p.basic)+Number(p.housing)+Number(p.transport)+Number(p.other_allowances);const ro=run.status!=='draft'?'disabled':'';
      return `<tr><td>${esc(p.profiles.full_name)}</td><td class="num">${money(gross)}</td><td class="num">${p.absent_days} ي / ${money(p.absence_deduction)}</td><td class="num">${money(p.late_deduction)}</td><td class="num">${money(p.gosi_deduction)}</td>
      <td><input type="number" step="0.01" value="${p.additions}" data-s="${p.id}" data-k="additions" ${ro}></td><td><input type="number" step="0.01" value="${p.other_deductions}" data-s="${p.id}" data-k="other_deductions" ${ro}></td><td class="num"><b>${money(p.net)}</b></td></tr>`}).join('')}
     </tbody></table></div>`:'<div class="card empty">ما فيه مسير لهذا الشهر. اضغط "إنشاء المسير".</div>'}`;
  $('#pm').onchange=e=>{S.sub.pm=e.target.value;aPayroll(box,re)};
  $('#gen').onclick=async e=>{e.target.disabled=true;e.target.innerHTML='<span class="spin"></span>';const {error}=await sb.rpc('generate_payroll',{p_year:y,p_month:m});if(!fail(error))toast('تم حساب المسير');aPayroll(box,re)};
  box.querySelectorAll('[data-s]').forEach(i=>i.onchange=async()=>{const {error}=await sb.from('payslips').update({[i.dataset.k]:Number(i.value||0)}).eq('id',i.dataset.s);if(!fail(error))aPayroll(box,re)});
  const setRun=async s=>{const {error}=await sb.from('payroll_runs').update({status:s}).eq('id',run.id);if(!fail(error)){toast(s==='approved'?'تم اعتماد المسير، يقدر الموظفين يشوفون قسائمهم':'تم تسجيل الصرف');aPayroll(box,re)}};
  $('#apr')&&($('#apr').onclick=()=>setRun('approved'));$('#paid')&&($('#paid').onclick=()=>setRun('paid'));
  $('#csv')&&($('#csv').onclick=()=>downloadCSV(`payroll-${ym}.csv`,[['الرقم الوظيفي','الاسم','الآيبان','الصافي'],...slips.map(p=>[p.profiles.employee_no,p.profiles.full_name,p.profiles.iban,Number(p.net).toFixed(2)])]));
}

async function aSet(box,re){
  const {data:hol}=await sb.from('holidays').select('*').order('holiday_date');
  const st=S.settings;
  const del=(tb,col,val,label)=>`<button class="btn ghost sm" data-del="${tb}|${col}|${val}">حذف</button>`;
  box.innerHTML=`
  <h2>الفروع ومواقع البصمة</h2><div class="card list">${S.branches.map(b=>`<div class="item"><div class="main"><div class="t">${esc(b.name)}</div><div class="small muted num" dir="ltr" style="text-align:right">${b.latitude.toFixed(5)}, ${b.longitude.toFixed(5)} · ${b.radius_m}m</div></div>${del('branches','id',b.id)}</div>`).join('')||'<div class="empty">أضف أول فرع عشان يقدر الموظفين يسجلون حضور</div>'}</div>
  <form id="bf" class="card stack" style="margin-top:10px"><b>إضافة فرع</b>
   <label class="f">اسم الفرع<input name="name" required placeholder="المقر الرئيسي"></label>
   <div class="grid2"><label class="f">خط العرض<input name="latitude" id="blat" required inputmode="decimal" dir="ltr"></label><label class="f">خط الطول<input name="longitude" id="blng" required inputmode="decimal" dir="ltr"></label></div>
   <button type="button" class="btn ghost" id="here">${I.pin.replace('<svg','<svg style="width:16px;height:16px;vertical-align:-3px"')} استخدم موقعي الحالي (وأنت في الفرع)</button>
   <label class="f">نطاق السماح بالمتر<input type="number" name="radius_m" value="150" min="20"></label>
   <button class="btn">إضافة الفرع</button></form>

  <h2>الورديات</h2><div class="card list">${S.shifts.map(s=>`<div class="item"><div class="main"><div class="t">${esc(s.name)}</div><div class="small muted num">${s.start_time.slice(0,5)} - ${s.end_time.slice(0,5)} · سماح ${s.grace_minutes} د · ${s.work_days.map(d=>DAYS[d]).join('، ')}</div></div>${del('shifts','id',s.id)}</div>`).join('')||'<div class="empty">ما فيه ورديات</div>'}</div>
  <form id="sf" class="card stack" style="margin-top:10px"><b>إضافة وردية</b>
   <label class="f">الاسم<input name="name" required placeholder="الدوام الصباحي"></label>
   <div class="grid3"><label class="f">البداية<input type="time" name="start_time" value="08:00" required></label><label class="f">النهاية<input type="time" name="end_time" value="16:00" required></label><label class="f">سماح (د)<input type="number" name="grace_minutes" value="15"></label></div>
   <div class="row small">${DAYS.map((d,i)=>`<label class="row" style="gap:4px"><input type="checkbox" data-wd="${i}" ${i<5?'checked':''}>${d}</label>`).join('')}</div>
   <button class="btn">إضافة الوردية</button></form>

  <h2>الأقسام</h2><div class="card list">${S.departments.map(d=>`<div class="item"><span>${esc(d.name)}</span>${del('departments','id',d.id)}</div>`).join('')||'<div class="empty">ما فيه أقسام</div>'}</div>
  <form id="df" class="row" style="margin-top:10px"><input name="name" required placeholder="اسم القسم" style="flex:1"><button class="btn">إضافة</button></form>

  <h2>العطل الرسمية</h2><div class="card list">${(hol||[]).map(h=>`<div class="item"><div><div class="t">${esc(h.name)}</div><div class="small muted">${fmtDate(h.holiday_date)}</div></div>${del('holidays','holiday_date',h.holiday_date)}</div>`).join('')||'<div class="empty">ما فيه عطل مضافة</div>'}</div>
  <form id="hf" class="grid2" style="margin-top:10px"><input type="date" name="holiday_date" required><input name="name" required placeholder="اليوم الوطني"><button class="btn" style="grid-column:1/-1">إضافة عطلة</button></form>

  <h2>أنواع الإجازات</h2><div class="card list">${S.leaveTypes.map(l=>`<div class="item"><span>${esc(l.name)} ${l.is_paid?'':'<span class="pill p-mute">بدون راتب</span>'}</span><label class="row small">أيام/سنة <input type="number" value="${l.default_days}" data-lt="${l.id}" style="width:80px"></label></div>`).join('')}</div>

  <h2>إعدادات عامة</h2><form id="gf" class="card stack">
   <label class="f">اسم الشركة<input name="company_name" value="${esc(st.company_name)}"></label>
   <div class="grid2"><label class="f">خصم كل دقيقة تأخير (ريال)<input type="number" step="0.01" name="late_deduction_per_minute" value="${st.late_deduction_per_minute}"></label>
   <label class="f">نسبة التأمينات على الموظف السعودي %<input type="number" step="0.01" name="gosi_employee_rate" value="${st.gosi_employee_rate}"></label>
   <label class="f">أيام الشهر لحساب أجر اليوم<input type="number" name="working_days_per_month" value="${st.working_days_per_month}"></label></div>
   <p class="small muted">تأكد من نسبة التأمينات الحالية من موقع التأمينات الاجتماعية، لأنها تتغير حسب تاريخ التسجيل.</p>
   <button class="btn">حفظ الإعدادات</button></form>`;

  const after=async msg=>{toast(msg);await loadRefs();re()};
  $('#here').onclick=async e=>{const b=e.currentTarget;b.disabled=true;try{const p=await getPos();$('#blat').value=p.coords.latitude.toFixed(6);$('#blng').value=p.coords.longitude.toFixed(6);toast(`تم أخذ موقعك (دقة ±${Math.round(p.coords.accuracy)} م)`)}catch(err){toast(geoErr(err),'bad')}b.disabled=false};
  $('#bf').onsubmit=async e=>{e.preventDefault();const f=form(e.target);f.latitude=Number(f.latitude);f.longitude=Number(f.longitude);f.radius_m=Number(f.radius_m||150);
    if(isNaN(f.latitude)||isNaN(f.longitude))return toast('الإحداثيات غير صحيحة','bad');const {error}=await sb.from('branches').insert(f);if(!fail(error))after('تمت إضافة الفرع')};
  $('#sf').onsubmit=async e=>{e.preventDefault();const f=form(e.target);f.grace_minutes=Number(f.grace_minutes||0);f.work_days=[...e.target.querySelectorAll('[data-wd]:checked')].map(c=>Number(c.dataset.wd));
    const {error}=await sb.from('shifts').insert(f);if(!fail(error))after('تمت إضافة الوردية')};
  $('#df').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('departments').insert(form(e.target));if(!fail(error))after('تمت إضافة القسم')};
  $('#hf').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('holidays').insert(form(e.target));if(!fail(error))after('تمت إضافة العطلة')};
  $('#gf').onsubmit=async e=>{e.preventDefault();const f=form(e.target);['late_deduction_per_minute','gosi_employee_rate','working_days_per_month'].forEach(k=>f[k]=Number(f[k]||0));
    const {error}=await sb.from('settings').update(f).eq('id',1);if(!fail(error))after('تم حفظ الإعدادات')};
  box.querySelectorAll('[data-lt]').forEach(i=>i.onchange=async()=>{const {error}=await sb.from('leave_types').update({default_days:Number(i.value||0)}).eq('id',i.dataset.lt);if(!fail(error))after('تم التحديث')});
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const [tb,col,val]=b.dataset.del.split('|');
    if(!confirm('متأكد من الحذف؟'))return;const {error}=await sb.from(tb).delete().eq(col,val);
    if(error&&/foreign key/i.test(error.message))return toast('ما يمكن الحذف لأنه مرتبط بموظفين أو سجلات','bad');if(!fail(error))after('تم الحذف')});
}

/* ---------- التشغيل ---------- */
let booted=null;
async function boot(session){
  if(!session){S.me=null;booted=null;vAuth();return}
  if(booted===session.user.id)return;booted=session.user.id;
  try{await Promise.all([loadMe(session.user.id),loadRefs()]);
    if(!S.me){app.innerHTML='<div class="alert warn" style="margin-top:20vh">ما لقينا ملف الموظف الخاص بك. تواصل مع الموارد البشرية.</div>';nav.hidden=true;return}
    if(!S.me.is_active){app.innerHTML='<div class="alert bad" style="margin-top:20vh">حسابك موقوف. تواصل مع الموارد البشرية.</div><button class="btn ghost" style="margin-top:12px" onclick="sb.auth.signOut()">خروج</button>';nav.hidden=true;return}
    if(isHR())await loadProfiles();
    render();
  }catch(e){booted=null;app.innerHTML=`<div class="alert bad" style="margin-top:20vh">تعذر الاتصال: ${esc(e.message)}</div>`}
}
sb.auth.onAuthStateChange((_e,session)=>{setTimeout(()=>boot(session),0)});
</script>
